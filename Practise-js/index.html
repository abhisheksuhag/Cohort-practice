<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO  with DOM Manipulation</title>
</head>
<script>
    const golbalId= 1;  
    
    function markAsDone(id){
        const parent= document.getElementById(id);
        parent.children[2].innerHTML = "Done";
    }
    function createChild(title , description, id){
        const child = document.createElement("div");
        const firstGrandChild = document.createElement("div");
        firstGrandChild.innerHTML= "title";
        const secondGrandChild = document.createElement("div");
        secondGrandChild.innerHTML = description;
        const thirdGrandChild = document.createElement("button");
        thirdGrandChild.innerHTML="Mark as done";
        thirdGrandChild.setAttribute("onClick", `markAsdone(${id})`);
        child.appendChild(firstGrandChild);
        child.appendChild(secondGrandChild);
        child.appendChild(thirdGrandChild);
        child.setAttribute("id", id);
        return child; 
    }
    function addTodo(){
        const title = document .getElementById("title").value;
        const description = document.getElementById("description").value;
        const existingElement = document.getElementById("container").innerHTML;
        // document.getElementById("container").innerHTML = existingElement +
        //     `<div>
        //         <div>Title: ${title} </div>
        //         <div>Description: ${description} </div>
        //         <button> Mark as done </button>
        //     <div>`
        existingElement.appendChild(createChild(title, description, golbalId++)); 
    

    }
</script>
<body>
    <div>
        <input id="title" type="text" placeholder=""Enter title here"></input><br></br>
        <input  id="description" type="text" placeholder="Enter description here"></input><br></br>
        <button onclick="addTodo()">Add Todo</button>
        <div id="container">todo list here </div>
    </div>
</body>
</html>
